name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build (gcc + make)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Show tool versions
        run: |
          gcc --version
          make --version

      - name: Build
        run: make all

      - name: Run minimal test
        run: make test

      - name: Verify executable
        run: |
          test -f ./main
          echo "Executable found: ./main"

      - name: Upload artifact (main)
        uses: actions/upload-artifact@v4
        with:
          name: electible-main
          path: ./main

      - name: Clean
        run: make clean

  test-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC and gcov
        run: sudo apt-get update && sudo apt-get install -y gcc build-essential

      - name: Build with coverage
        run: |
          make coverage

      - name: Run Tests
        run: |
          chmod +x ./test
          ./test > test_results.txt 2>&1

      - name: Run Coverage
        run: make coverage > gcov.txt

      - name: Upload Test Results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Test Results
          path: ./test_results.txt

      - name: Upload Coverage Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Coverage Reports
          path: |
            *.txt

  quality:
    name: Static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check trailing whitespace in C headers/sources
        run: |
          set -e
          ! git grep -I --line-number --extended-regexp '\s+$' -- '*.c' 'include/*.h' || \
          (echo "Found trailing whitespace in the above files"; exit 1)

      - name: Verify required files exist
        run: |
          test -d include
          test -f Makefile
          echo "Basic project structure verified"

      - name: Count lines of code (C only)
        run: |
          echo "Lines of code (C sources + headers):"
          wc -l *.c include/*.h | tail -n 1

      - name: Check for TODOs
        run: |
          echo "TODOs found:"
          grep -rn "TODO" -- '*.c' 'include/*.h' || echo "No TODOs found"